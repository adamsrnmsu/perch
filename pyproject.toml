[project]
name = "perch"
version = "0.1.0"
description = "What the open board means for the budget: the join between gitboard and Budgie"
requires-python = ">=3.10"
# Budgie is not on PyPI, and whatever answers to that name there is not ours,
# so it is pinned to its repo by URL: an explicit URL never resolves to a
# stranger's package. `make venv` then installs ../budgie editable on top for
# local dev. The repo is private, so the install uses your SSH key.
dependencies = [
    "budgie @ git+ssh://git@github.com/adamsrnmsu/budgie.git",
    "click",
    "rich",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=6.2.4", "ruff"]
docs = ["sphinx", "myst-parser", "shibuya", "sphinx-click"]

[project.scripts]
perch = "perch.cli:cli"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perch*"]

[tool.pytest.ini_options]
testpaths = ["perch/tests"]
